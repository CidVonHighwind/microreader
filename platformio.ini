; PlatformIO project configuration for microreader2 firmware.
; Desktop build lives under platforms/desktop/ (CMake + SDL2).

[platformio]
default_envs = esp32c3
src_dir = platforms/esp32

[env:esp32c3]
platform  = espressif32 @ ^7.0.1
board     = esp32-c3-devkitm-1
framework = espidf
extra_scripts = pre:tools/patch_ffconf.py, pre:tools/generate_version.py, pre:tools/generate_assets.py, post:tools/copy_firmware.py

; --- Flash / upload ---
board_build.partitions    = platforms/esp32/default_16MB.csv
board_build.flash_size    = 16MB
board_build.flash_mode    = dio
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
upload_speed              = 921600
upload_port               = COM4

; --- Serial monitor ---
monitor_speed  = 115200
monitor_port   = COM4
monitor_rts    = 0
monitor_dtr    = 0
monitor_flags  = --reconnect
monitor_filters = esp32_exception_decoder

; --- Compiler flags ---
build_flags =
    -Ilib
    -Wno-format-truncation

; --- sdkconfig overrides (merged into generated sdkconfig.esp32c3) ---
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"

; ---- Xteink X3 build (792x528 panel, UC8253/UC8279 controller) ----
; Same code, different device: see platforms/esp32/epd_x3.h.
[env:esp32c3-x3]
platform  = espressif32 @ ^7.0.1
board     = esp32-c3-devkitm-1
framework = espidf
extra_scripts = pre:tools/patch_ffconf.py, pre:tools/generate_version.py, pre:tools/generate_assets.py, post:tools/copy_firmware.py

board_build.partitions    = platforms/esp32/default_16MB.csv
board_build.flash_size    = 16MB
board_build.flash_mode    = dio
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
upload_speed              = 921600

monitor_speed  = 115200
monitor_rts    = 0
monitor_dtr    = 0
monitor_flags  = --reconnect
monitor_filters = esp32_exception_decoder

build_flags =
    -Ilib
    -Wno-format-truncation
    -DMICROREADER_X3

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
    -DMICROREADER_X3_BUILD=1

; ---- QEMU emulation build ----
; Build with: pio run -e esp32c3-qemu
; Run with:   python tools/run_qemu.py
[env:esp32c3-qemu]
platform  = espressif32 @ ^7.0.1
board     = esp32-c3-devkitm-1
framework = espidf

board_build.partitions    = platforms/esp32/default_qemu.csv
board_build.flash_size    = 16MB
board_build.flash_mode    = dio
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
    -Ilib
    -DQEMU_BUILD

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu"

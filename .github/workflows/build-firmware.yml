# Builds the ESP32-C3 firmware on GitHub's servers and publishes it as a
# release with a ready-to-flash `sami-firmware.bin` (an app image for the
# CrossPoint web flasher's custom-firmware option, which writes it to the
# spare OTA slot).
#
# Runs on every push. Nothing needs to be installed on your own computer.

name: Build firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: tools/generate_version.py counts commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Install the ESP-IDF framework and toolchain
        run: pio pkg install -e esp32c3

      # tools/patch_ffconf.py enables exFAT SD cards by patching the framework's
      # ffconf.h. As a pre-build script it silently skips when the framework
      # isn't installed yet (always the case on a fresh build machine), which
      # would produce firmware that can't read exFAT cards. Apply it now and
      # refuse to continue if it didn't take.
      - name: Enable exFAT SD card support
        run: |
          python tools/patch_ffconf.py
          grep -q "patched by tools/patch_ffconf.py" ~/.platformio/packages/framework-espidf/components/fatfs/src/ffconf.h

      - name: Build (X4)
        run: pio run -e esp32c3

      - name: Collect the X4 firmware file
        run: |
          cp .pio/build/esp32c3/firmware.bin sami-firmware.bin
          ls -l sami-firmware.bin
          # Sanity check: an ESP32 app image starts with the 0xE9 magic byte.
          test "$(head -c1 sami-firmware.bin | od -An -tx1 | tr -d ' ')" = "e9"

      - name: Build (X3, experimental)
        run: pio run -e esp32c3-x3

      - name: Collect the X3 firmware file
        run: |
          cp .pio/build/esp32c3-x3/firmware.bin sami-firmware-x3.bin
          ls -l sami-firmware-x3.bin
          test "$(head -c1 sami-firmware-x3.bin | od -An -tx1 | tr -d ' ')" = "e9"
          # The two devices must not get each other's firmware.
          cmp -s sami-firmware.bin sami-firmware-x3.bin && exit 1 || true

      # Each file must fit the device's firmware slot (X4: 0x640000 bytes,
      # X3: 0x770000), or the flasher would cut it off.
      - name: Check the firmware fits
        run: |
          x4=$(stat -c%s sami-firmware.bin); x3=$(stat -c%s sami-firmware-x3.bin)
          echo "X4: $x4 of 6553600 bytes; X3: $x3 of 7798784 bytes"
          test "$x4" -le 6553600
          test "$x3" -le 7798784

      - name: Keep the files with this run
        uses: actions/upload-artifact@v4
        with:
          name: sami-firmware
          path: |
            sami-firmware.bin
            sami-firmware-x3.bin

      # The release is named by the first line of release.txt
      # ("Build 10 - homepage options and fonts" → tag build-10); the lines
      # after it are the release's "What's new". Pushing again with the same
      # name replaces that release. Without release.txt, releases are numbered
      # by workflow run as before.
      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sami build ${{ github.run_number }} (${{ github.ref_name }})"
          tag="build-${{ github.run_number }}"
          news=""
          if [ -f release.txt ]; then
            first=$(head -n1 release.txt | tr -d '\r')
            num=$(printf '%s' "$first" | sed -n 's/^Build \([0-9][0-9]*\).*/\1/p')
            if [ -n "$num" ]; then
              title="$first"
              tag="build-$num"
              news=$(tail -n +2 release.txt)
            fi
          fi
          notes=$(cat <<'EOF'
          Firmware for the Xteink X4 and X3, built automatically from this repository.

          **To install:** download the file for your device below, then flash it with the
          CrossPoint web flasher (https://crosspointreader.com/#flash-tools) in Chrome or
          Edge, using its option to flash your own firmware file. Choose your device's model.

          - `sami-firmware.bin` — Xteink **X4**
          - `sami-firmware-x3.bin` — Xteink **X3** (experimental)
          EOF
          )
          if [ -n "$news" ]; then
            notes=$(printf "**What's new**\n\n%s\n\n%s" "$news" "$notes")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Replacing the existing release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          fi
          gh release create "$tag" sami-firmware.bin sami-firmware-x3.bin \
            --target "${{ github.sha }}" \
            --title "$title" \
            --notes "$notes"
